name: Firmware CI

on:
  push:
    branches: [feature/pylontech-bms-psu-topology]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Unit test passive Pylontech decoder (host compiler)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Iinclude tests/pylontech_decoder_test.cpp -o /tmp/pylontech-test
          /tmp/pylontech-test
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install -U platformio
      - name: Compile original VX1 firmware
        run: pio run -e vx1
      - name: Compile original Gree LTO firmware
        run: pio run -e gree_tractor
      - name: Compile BIOM Pylontech firmware
        run: pio run -e biom_pylontech
      - name: Build LittleFS dashboard image
        run: pio run -e biom_pylontech -t buildfs
      - name: Publish firmware for bench testing
        uses: actions/upload-artifact@v4
        with:
          name: biom-pylontech-esp32s3
          path: |
            .pio/build/biom_pylontech/firmware.bin
            .pio/build/biom_pylontech/bootloader.bin
            .pio/build/biom_pylontech/partitions.bin
            .pio/build/biom_pylontech/littlefs.bin
          if-no-files-found: error
